<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">ViksitPDS Demo Architecture - Three Modules</title>
  <desc id="desc">Three operational demo modules plus Trust overlay, Keycloak OIDC, NestJS, PostgreSQL, and Fabric proofs.</desc>

  <rect width="1400" height="980" fill="#f7f6f2"/>
  <text x="40" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1a2332" font-weight="700">ViksitPDS - Demo Architecture</text>
  <text x="40" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5a6573">Three operational modules + Trust layer � PostgreSQL authoritative � Fabric async proofs</text>

  <!-- THREE MODULES -->
  <rect x="40" y="90" width="1320" height="250" rx="10" fill="#fff" stroke="#2f6fed" stroke-width="2"/>
  <text x="56" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6fed" font-weight="700" letter-spacing="0.06em">THREE OPERATIONAL DEMO MODULES  (apps/web /m/*)</text>

  <rect x="56" y="136" width="400" height="184" rx="8" fill="#edf3ff" stroke="#2f6fed"/>
  <text x="76" y="164" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1a2332" font-weight="700">1. Supply chain</text>
  <text x="76" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6573">/m/supply-chain</text>
  <text x="76" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Custody from FCI through godowns</text>
  <text x="76" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Screens: workbench � lots</text>
  <text x="76" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">transfers � allocations</text>
  <text x="76" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6573">In-app ops + supply fixtures</text>
  <text x="76" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6573">Roles: FCI � Godown � DSO � BSO</text>

  <rect x="480" y="136" width="400" height="184" rx="8" fill="#edf3ff" stroke="#2f6fed"/>
  <text x="500" y="164" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1a2332" font-weight="700">2. Card &amp; eligibility</text>
  <text x="500" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6573">/m/eligibility</text>
  <text x="500" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Ration-card integrity review</text>
  <text x="500" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Screens: eligibility-review</text>
  <text x="500" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">ghost / list integrity screening</text>
  <text x="500" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6573">Mock: eligibility-mock :3010</text>
  <text x="500" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6573">Roles: Control Office � Mgmt � Auditor</text>

  <rect x="904" y="136" width="436" height="184" rx="8" fill="#edf3ff" stroke="#2f6fed"/>
  <text x="924" y="164" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1a2332" font-weight="700">3. FPS authentication</text>
  <text x="924" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6573">/m/fps</text>
  <text x="924" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Shop receipt, auth, and ration issue</text>
  <text x="924" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Screens: workbench � allocations</text>
  <text x="924" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">distribution (auth + issue)</text>
  <text x="924" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6573">Mock: epos-auth-mock :3011</text>
  <text x="924" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6573">Roles: FPS � Mgmt � Auditor</text>

  <!-- Trust + Keycloak (equal prominence) -->
  <rect x="40" y="360" width="700" height="88" rx="8" fill="#f4f0fa" stroke="#6b5b95" stroke-width="2"/>
  <text x="56" y="388" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b5b95" font-weight="700">Trust &amp; reconcile  (ViksitPDS overlay � /m/trust)</text>
  <text x="56" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Cross-module overview � stakeholders � audit-alerts � verify � Fabric proof analytics</text>
  <text x="56" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6573">Not a fourth operational module � oversight over the three modules above (+ /admin separate)</text>

  <rect x="760" y="360" width="600" height="88" rx="8" fill="#fff" stroke="#6b5b95" stroke-width="2"/>
  <text x="780" y="388" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b5b95" font-weight="700">IDENTITY � Keycloak OIDC</text>
  <text x="780" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">realm: viksitpds � browser PKCE login � API JWT / JWKS</text>
  <text x="780" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6573">Compose profile: iam � port 8080 � demo persona login</text>

  <!-- API + PG -->
  <rect x="40" y="470" width="760" height="200" rx="8" fill="#fff" stroke="#0f7a5a" stroke-width="2"/>
  <text x="56" y="496" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f7a5a" font-weight="700">APPS/API � NestJS</text>
  <rect x="56" y="512" width="170" height="56" rx="4" fill="#e8f7f1" stroke="#0f7a5a"/>
  <text x="141" y="536" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332" font-weight="700">AuthGuard + AuthZ</text>
  <text x="141" y="554" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">OIDC + DB scopes</text>
  <rect x="242" y="512" width="170" height="56" rx="4" fill="#e8f7f1" stroke="#0f7a5a"/>
  <text x="327" y="536" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332" font-weight="700">Module APIs</text>
  <text x="327" y="554" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">lots � eligibility � auth</text>
  <rect x="428" y="512" width="170" height="56" rx="4" fill="#e8f7f1" stroke="#0f7a5a"/>
  <text x="513" y="536" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332" font-weight="700">PdsLedgerFacade</text>
  <text x="513" y="554" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">domain engine</text>
  <rect x="614" y="512" width="166" height="56" rx="4" fill="#e8f7f1" stroke="#0f7a5a"/>
  <text x="697" y="536" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332" font-weight="700">Integrations</text>
  <text x="697" y="554" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">source-event APIs</text>

  <rect x="56" y="584" width="360" height="64" rx="4" fill="#dff3ea" stroke="#0f7a5a"/>
  <text x="236" y="612" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332" font-weight="700">PdsLedgerPort factory</text>
  <text x="236" y="632" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">demo in-process � fabric gateway</text>
  <rect x="434" y="584" width="346" height="64" rx="4" fill="#dff3ea" stroke="#0f7a5a"/>
  <text x="607" y="612" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332" font-weight="700">Outbox worker</text>
  <text x="607" y="632" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">SKIP LOCKED � RecordLedgerProof</text>

  <rect x="820" y="470" width="540" height="200" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="836" y="496" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b45309" font-weight="700">POSTGRESQL � AUTHORITATIVE</text>
  <text x="836" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Module 1: lots � transfers � fps_allocations � stock</text>
  <text x="836" y="552" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Module 2: eligibility_cases � screenings � registry</text>
  <text x="836" y="576" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Module 3: auth_transactions � distributions</text>
  <text x="836" y="608" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a2332">Shared: ledger_events � integration_events</text>
  <text x="836" y="640" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309" font-weight="700">ledger_outbox  PENDING to COMMITTED</text>

  <!-- Fabric -->
  <rect x="40" y="700" width="1320" height="230" rx="8" fill="#fff" stroke="#1a2332" stroke-width="2"/>
  <text x="56" y="728" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2332" font-weight="700">HYPERLEDGER FABRIC 2.5.15 � async non-sensitive proofs from all three modules</text>

  <rect x="56" y="752" width="180" height="56" rx="4" fill="#f0f1f3" stroke="#1a2332"/>
  <text x="146" y="778" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2332" font-weight="700">Orderer</text>
  <text x="146" y="796" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">Raft demo</text>

  <rect x="256" y="752" width="220" height="56" rx="4" fill="#edf3ff" stroke="#2f6fed"/>
  <text x="366" y="778" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2332" font-weight="700">peer0.food</text>
  <text x="366" y="796" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">FoodAndCivilSuppliesMSP</text>

  <rect x="496" y="752" width="220" height="56" rx="4" fill="#edf3ff" stroke="#2f6fed"/>
  <text x="606" y="778" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2332" font-weight="700">peer0.godown</text>
  <text x="606" y="796" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">GodownWarehouseMSP</text>

  <rect x="736" y="752" width="180" height="56" rx="4" fill="#f0f1f3" stroke="#1a2332"/>
  <text x="826" y="778" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2332" font-weight="700">CouchDB x2</text>
  <text x="826" y="796" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6573">world state</text>

  <rect x="936" y="752" width="400" height="56" rx="4" fill="#1a2332"/>
  <text x="1136" y="778" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700">pds-chaincode � RecordLedgerProof</text>
  <text x="1136" y="796" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c5ced8">channel pdschannel � privacy hashes only</text>

  <text x="56" y="846" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6573">Proof buckets on Trust Overview: supply-chain � eligibility � fps  (from ledger_outbox analytics)</text>
  <text x="56" y="870" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6573">Demo default: PDS_LEDGER_MODE=demo (in-process). Live peers: --profile fabric. Auth: Keycloak OIDC.</text>
  <text x="56" y="900" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7a8796">Evidence: apps/web/src/lib/modules.ts � docker-compose � fabric-gateway.ledger-port � Keycloak iam profile</text>
</svg>
